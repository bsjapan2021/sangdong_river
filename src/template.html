.lbl.big{font-size:14px;font-weight:600;background:rgba(10,40,48,.78);border-color:rgba(63,182,201,.5)}
.lbl.sensor{font-family:var(--mono);font-size:11px;pointer-events:auto;cursor:pointer}
.lbl.sensor.in{border-color:var(--intake)} .lbl.sensor.ctr{border-color:var(--ok)} .lbl.sensor.out{border-color:var(--return)}
.lbl.sensor.sel{background:rgba(20,60,70,.95)}

.panel{position:fixed;background:var(--glass);border:1px solid var(--glass-line);border-radius:10px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

<script>
const OSM = __DATA__;
(function(){
'use strict';
const $=s=>document.querySelector(s);
const stage=$('#stage');
const renderer=new THREE.WebGLRenderer({antialias:true,logarithmicDepthBuffer:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,1,6000);
camera.position.set(260,240,330);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.target.set(-10,0,0);
controls.enableDamping=true;controls.dampingFactor=.08;
controls.maxPolarAngle=Math.PI*0.495;controls.minDistance=12;controls.maxDistance=1400;
controls.update();

const hemi=new THREE.HemisphereLight(0xdfefff,0x55633f,0.55);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,1.1);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
const sc=sun.shadow.camera;sc.left=-420;sc.right=420;sc.top=420;sc.bottom=-420;sc.near=10;sc.far=1600;
sun.shadow.bias=-0.0006;sun.shadow.normalBias=0.6;
scene.add(sun);scene.add(sun.target);

/* ---------- geometry helpers ---------- */
const pairs=a=>{const o=[];for(let i=0;i<a.length;i+=2)o.push([a[i],a[i+1]]);return o};
function inPoly(p,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if(((a[1]>p[1])!==(b[1]>p[1]))&&(p[0]<(b[0]-a[0])*(p[1]-a[1])/(b[1]-a[1])+a[0]))c=!c}return c}
function segDist(p,a,b){const dx=b[0]-a[0],dz=b[1]-a[1];const l=dx*dx+dz*dz;let t=l?((p[0]-a[0])*dx+(p[1]-a[1])*dz)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dz)}
function polyEdgeDist(p,poly){let d=1e9;for(let i=0;i<poly.length-1;i++)d=Math.min(d,segDist(p,poly[i],poly[i+1]));return d}
function shapeOf(pts){const s=new THREE.Shape();pts.forEach((p,i)=>i?s.lineTo(p[0],-p[1]):s.moveTo(p[0],-p[1]));return s}
function flat(pts,y,mat,holes){const s=shapeOf(pts);(holes||[]).forEach(h=>{const hp=new THREE.Path();h.forEach((p,i)=>i?hp.lineTo(p[0],-p[1]):hp.moveTo(p[0],-p[1]));s.holes.push(hp)});
  const g=new THREE.ShapeGeometry(s);g.rotateX(-Math.PI/2);const m=new THREE.Mesh(g,mat);m.position.y=y;m.receiveShadow=true;return m}
function ribbon(pts,w,y,out,yFn){const n=pts.length;if(n<2)return;const L=[],R=[];
  for(let i=0;i<n;i++){const p=pts[i],a=pts[Math.max(0,i-1)],b=pts[Math.min(n-1,i+1)];
    let dx=b[0]-a[0],dz=b[1]-a[1];const l=Math.hypot(dx,dz)||1;dx/=l;dz/=l;
    let nx=-dz,nz=dx,k=1;
    if(i>0&&i<n-1){const d1=[p[0]-a[0],p[1]-a[1]],l1=Math.hypot(...d1)||1;const n1=[-d1[1]/l1,d1[0]/l1];k=1/Math.max(0.5,n1[0]*nx+n1[1]*nz)}
    const h=w/2*k,yy=yFn?yFn(i,n):y;L.push([p[0]+nx*h,yy,p[1]+nz*h]);R.push([p[0]-nx*h,yy,p[1]-nz*h])}
  for(let i=0;i<n-1;i++){out.push(...L[i],...R[i],...L[i+1],...R[i],...R[i+1],...L[i+1])}}
function meshFrom(arr,mat,shadow){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(arr,3));g.computeVertexNormals();
  const m=new THREE.Mesh(g,mat);m.receiveShadow=true;if(shadow)m.castShadow=true;return m}
const M=c=>new THREE.MeshLambertMaterial({color:c});

/* ---------- parse OSM ---------- */
const F=OSM.filter(f=>f[0]!=='L').map(f=>({c:f[0],name:f[1],h:f[2],fl:f[3],pts:pairs(f[4])}));
const lakeF=F.find(f=>f.c==='water'&&f.name==='상동호수');const LAKE=lakeF.pts;
const sangdong=F.find(f=>f.c==='park'&&f.name==='상동호수공원');

/* ground with lake hole */
const groundPts=[[-900,-900],[900,-900],[900,900],[-900,900],[-900,-900]];
const groundMat=M(0x8a877d);
scene.add(flat(groundPts,0,groundMat,[LAKE]));

const AREA={residential:[0xa7a291,0.03],school:[0xb3a98d,0.04],park:[0x6f9a52,0.07],grass:[0x86a95e,0.07],garden:[0x8fb36a,0.09],
  pitch:[0x4f9a5a,0.12],parking:[0x5d6266,0.12],playground:[0xc9a26b,0.14],pedestrian:[0xb3aa94,0.14],service:[0x6b6f72,0.12]};
const areaMeshes=[];
F.forEach(f=>{ if(!(f.fl&8))return; if(f.c==='building'||f.c==='water'&&f===lakeF)return;
  let key=f.c; if(key==='water'){scene.add(flat(f.pts,0.1,new THREE.MeshLambertMaterial({color:0x3d8ea0}),[]));return}
  if((f.c==='pedestrian'||f.c==='service')&&!(f.fl&4)&&f.c!=='service'){/* closed path ring, drawn as line later */return}
  const a=AREA[key]; if(!a)return;
  const holes=f===sangdong?[LAKE]:[];
  const m=flat(f.pts,a[1],M(a[0]),holes);scene.add(m);areaMeshes.push(m)});

/* pitch lines */
{const arr=[];F.filter(f=>f.c==='pitch').forEach(f=>{const p=f.pts.slice();ribbon(p,0.5,0.16,arr)});scene.add(meshFrom(arr,M(0xe9efe4)))}

/* lake basin, rim, water */
{const bed=flat(LAKE,-2.4,M(0x2f4a46));scene.add(bed);
 const wall=[];for(let i=0;i<LAKE.length-1;i++){const a=LAKE[i],b=LAKE[i+1];wall.push(a[0],0.05,a[1],b[0],0.05,b[1],a[0],-2.4,a[1],b[0],0.05,b[1],b[0],-2.4,b[1],a[0],-2.4,a[1])}
 const wm=meshFrom(wall,new THREE.MeshLambertMaterial({color:0x6d6a60,side:THREE.DoubleSide}));scene.add(wm);
 const rim=[];ribbon(LAKE,1.6,0.18,rim);scene.add(meshFrom(rim,M(0xb9b4a6)))}

const RET=[-36,104],INT=[-72,-45],CTR=[-35,30],MOD=[-122,-56];
const waterU={uTime:{value:0},uHeat:{value:0},uRet:{value:new THREE.Vector2(RET[0],RET[1])},uSun:{value:new THREE.Vector3(0,1,0)},uSky:{value:new THREE.Color(0x9fd0e6)}};
const waterMat=new THREE.ShaderMaterial({uniforms:waterU,transparent:true,
 vertexShader:`#include <common>
#include <logdepthbuf_pars_vertex>
varying vec3 vW;void main(){vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;
#include <logdepthbuf_vertex>
}`,
 fragmentShader:`#include <common>
#include <logdepthbuf_pars_fragment>
uniform float uTime,uHeat;uniform vec2 uRet;uniform vec3 uSun,uSky;varying vec3 vW;
 float h(vec2 p){return sin(p.x*.35+uTime*1.1)*.5+sin(p.y*.42-uTime*.9)*.5+sin((p.x+p.y)*.21+uTime*.6)*.5;}
 vec3 heat(float t){vec3 a=vec3(.17,.29,.54),b=vec3(.18,.62,.70),c=vec3(.44,.86,.55),d=vec3(.96,.89,.36);
   return t<.33?mix(a,b,t/.33):t<.66?mix(b,c,(t-.33)/.33):mix(c,d,(t-.66)/.34);}
 void main(){
#include <logdepthbuf_fragment>
vec2 p=vW.xz;float e=.6;vec3 n=normalize(vec3(h(p+vec2(e,0.))-h(p-vec2(e,0.)),6.,h(p+vec2(0.,e))-h(p-vec2(0.,e))));
  vec3 V=normalize(cameraPosition-vW);float fr=pow(1.-max(dot(n,V),0.),3.);
  vec3 base=mix(vec3(.10,.30,.33),vec3(.20,.47,.47),.5+.5*sin(p.x*.03+p.y*.02));
  float d=distance(p,uRet);float t=clamp(1.-d/150.+.06*sin(d*.15-uTime*1.5),0.,1.);
  base=mix(base,heat(t),uHeat*.85);
  vec3 R=reflect(-V,n);float sp=pow(max(dot(R,normalize(uSun)),0.),120.)*1.4;
  vec3 col=mix(base,uSky,fr*.55)+sp;
  gl_FragColor=vec4(col,.93);}`});
{const wg=new THREE.ShapeGeometry(shapeOf(LAKE),1);wg.rotateX(-Math.PI/2);const w=new THREE.Mesh(wg,waterMat);w.position.y=-0.55;scene.add(w)}

/* fountain jets in lake (decor) */

/* roads & paths */
const W={motorway:20,motorway_link:8,secondary:16,tertiary:11,tertiary_link:7,service:5,living_street:4,pedestrian:3.4,footway:2,path:1.6,cycleway:2.4,steps:2.2};
const RC={motorway:0x4a4d52,motorway_link:0x4f5257,secondary:0x505357,tertiary:0x585b5f,tertiary_link:0x585b5f,service:0x64676a,living_street:0x6a6d70,
  pedestrian:0xd9d0bb,footway:0xd2c7ae,path:0xb89f78,cycleway:0xb86a5a,steps:0xb7b0a2};
const RY={motorway:0.22,motorway_link:0.22,secondary:0.2,tertiary:0.2,tertiary_link:0.2,service:0.18,living_street:0.18,pedestrian:0.24,footway:0.25,path:0.25,cycleway:0.26,steps:0.25};
const buckets={};const pillars=[];const bridgeDecks=[];
F.forEach(f=>{ if(!W[f.c])return; if((f.fl&8)&&(f.fl&4))return; if(f.fl&2)return;
  const isBridge=f.fl&1;const pts=f.pts;
  let by=RY[f.c];let yFn=null;
  if(isBridge){const mid=pts[Math.floor(pts.length/2)];const overLake=pts.some(p=>inPoly(p,LAKE))||inPoly([(pts[0][0]+pts[pts.length-1][0])/2,(pts[0][1]+pts[pts.length-1][1])/2],LAKE);
    const top=f.c==='motorway'?11:f.c==='motorway_link'?7:overLake?1.1:6;
    yFn=(i,n)=>{if(f.c==='motorway')return top;const t=i/(n-1);return overLake?top:by+(top-by)*Math.min(1,Math.sin(Math.PI*t)*1.6)};

/* ---------- trees ---------- */
let seed=20261026;const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
const exclPolys=F.filter(f=>(f.fl&8)&&['pitch','parking','playground','building','water'].includes(f.c)||((f.fl&4)&&f.c==='pedestrian')).map(f=>f.pts);
const lineSegs=[];F.forEach(f=>{if(W[f.c]&&!((f.fl&8)&&(f.fl&4))){for(let i=0;i<f.pts.length-1;i++)lineSegs.push([f.pts[i],f.pts[i+1],W[f.c]/2+1.6])}});
function okTree(p){if(inPoly(p,LAKE)||polyEdgeDist(p,LAKE)<4)return false;for(const e of exclPolys)if(inPoly(p,e))return false;
  for(const s of lineSegs){if(Math.abs(p[0]-s[0][0])>60&&Math.abs(p[0]-s[1][0])>60)continue;if(segDist(p,s[0],s[1])<s[2])return false}
  if(Math.hypot(p[0]-MOD[0],p[1]-MOD[1])<10)return false;return true}
const treePts=[];
function scatter(poly,n,minGap){const xs=poly.map(p=>p[0]),zs=poly.map(p=>p[1]);const x0=Math.min(...xs),x1=Math.max(...xs),z0=Math.min(...zs),z1=Math.max(...zs);
  let tries=0,made=0;while(made<n&&tries<n*30){tries++;const p=[x0+rnd()*(x1-x0),z0+rnd()*(z1-z0)];if(!inPoly(p,poly)||!okTree(p))continue;
    let near=false;for(let k=treePts.length-1;k>=Math.max(0,treePts.length-400);k--){const q=treePts[k];if((q[0]-p[0])**2+(q[1]-p[1])**2<minGap*minGap){near=true;break}}if(near)continue;treePts.push(p);made++}}

  for(let s=6;s<L;s+=11){const t=s/L;for(const sd of[-1,1]){const o=W[f.c]/2+2.2;const p=[a[0]+(b[0]-a[0])*t+nx*o*sd,a[1]+(b[1]-a[1])*t+nz*o*sd];if(Math.abs(p[0])<520&&Math.abs(p[1])<520&&!inPoly(p,LAKE))treePts.push(p)}}}});

{const crownG=new THREE.IcosahedronGeometry(1,1);const trunkG=new THREE.CylinderGeometry(.18,.26,1,6);

  o.position.set(p[0],th+s*.85,p[1]);o.scale.set(s,s*(1.05+rnd()*.35),s);o.rotation.y=rnd()*6;o.updateMatrix();crown.setMatrixAt(i,o.matrix);
  c.setHex(pal[Math.floor(rnd()*pal.length)]);c.offsetHSL(0,0,(rnd()-.5)*.06);crown.setColorAt(i,c)});
 crown.castShadow=true;crown.receiveShadow=true;trunk.castShadow=true;treeGroup.add(trunk,crown)}

/* ---------- sky / time of day ---------- */
const skyTop=new THREE.Color(),skyHor=new THREE.Color();
function setTime(h){const t=(h-6)/14;const el=Math.sin(Math.PI*t);const az=Math.PI*(0.15+t*0.7);
  const r=900;sun.position.set(Math.cos(az)*r*0.8,Math.max(40,el*r),-Math.sin(az)*r*0.2+r*0.55);sun.target.position.set(0,0,0);

  sun.color.setHSL(0.09,0.6*warm+0.1,0.5+0.45*(1-warm*.5));sun.intensity=0.22+el*0.62;hemi.intensity=0.32+el*0.22;

  scene.background=skyHor.clone().lerp(skyTop,0.45);scene.fog=new THREE.Fog(scene.background,1400,3600);
  waterU.uSun.value.copy(sun.position).normalize();waterU.uSky.value.copy(skyTop).lerp(skyHor,.5);

   <div class="flow">취수 <i>S-01</i> → 펌프 → O₂ 공급 → UFB 발생부 → 와류 TiO₂/UVA 반응부 → 환수 <i>S-03</i><br>부표를 누르면 지점별 수질값을 볼 수 있습니다.</div>
   <div style="margin-top:8px"><span class="pill">배치 위치는 제안안 · 현장 협의 후 확정</span></div>`;return}

/* ---------- loop ---------- */
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const tmp=new THREE.Vector3();const clock=new THREE.Clock();
function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function loop(){requestAnimationFrame(loop);const dt=clock.getDelta(),T=clock.elapsedTime;
  if(!reduce)waterU.uTime.value=T;
  if(fly){let t=Math.min(1,(performance.now()-fly.s)/fly.d);const k=reduce?1:ease(t);camera.position.lerpVectors(fly.p0,fly.p1,k);controls.target.lerpVectors(fly.t0,fly.t1,k);if(t>=1||reduce)fly=null}
  controls.update();
  [intakePipe,returnPipe].forEach(pp=>pp.dots.forEach(d=>{d.userData.t=(d.userData.t+dt*(reduce?0:0.06))%1;d.position.copy(pp.curve.getPointAt(d.userData.t))}));
  buoys.forEach((b,i)=>{const s=1+0.25*Math.sin(T*2+i);b.userData.ring.scale.set(s,s,s);b.userData.ring.material.opacity=.65-.35*(s-1)/.25*.5;b.position.y=-0.55+0.06*Math.sin(T*1.4+i)});
  renderer.render(scene,camera);
  const w=innerWidth,h=innerHeight;
  LBL.forEach(l=>{if(l.hidden){l.el.style.display='none';return}tmp.copy(l.v).project(camera);
    const vis=tmp.z<1&&tmp.x>-1.1&&tmp.x<1.1&&tmp.y>-1.1&&tmp.y<1.1;const d=camera.position.distanceTo(l.v);
    if(!vis||(l.group==='name'&&!l.el.classList.contains('big')&&d>900)){l.el.style.display='none';return}
    l.el.style.display='block';l.el.style.left=((tmp.x+1)/2*w)+'px';l.el.style.top=((1-tmp.y)/2*h)+'px'});
  const az=Math.atan2(camera.position.x-controls.target.x,camera.position.z-controls.target.z);
  $('#cneedle').setAttribute('transform',`rotate(${-az*180/Math.PI} 20 20)`);
}
loop();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

<style>
/* Layout: full-bleed 3D scene, glass control panels floating at the corners (control-room overlay) */
:root{
  --ink:#e8f1f2; --ink-2:#9fb4b8; --ink-3:#6c8286;
  --glass:rgba(12,24,28,.78); --glass-line:rgba(160,210,215,.18);
  --water:#3fb6c9; --intake:#4ea8ff; --return:#ff9a3d; --ok:#5fd39a; --warn:#f2c14e;
  --bg:#0b1417;
  --ui:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font-size:12px;font-weight:500;color:var(--ink);
  background:rgba(8,18,21,.72);border:1px solid var(--glass-line);padding:2px 8px;border-radius:4px;letter-spacing:.01em}
.lbl.big{font-size:14px;font-weight:600;background:rgba(10,40,48,.78);border-color:rgba(63,182,201,.5)}
.lbl.sensor{font-family:var(--mono);font-size:11px;pointer-events:auto;cursor:pointer}
.lbl.sensor.in{border-color:var(--intake)} .lbl.sensor.ctr{border-color:var(--ok)} .lbl.sensor.out{border-color:var(--return)}
.lbl.sensor.sel{background:rgba(20,60,70,.95)}
.lbl.module{border-color:var(--warn);color:#fff3cf}
.panel{position:fixed;background:var(--glass);border:1px solid var(--glass-line);border-radius:10px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#head{top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));padding:12px 14px;max-width:min(340px,calc(100vw - 24px))}
#head .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--water)}
#head h1{margin:4px 0 2px;font-size:18px;font-weight:600;text-wrap:balance}
#head p{margin:0;font-size:12px;color:var(--ink-2);line-height:1.5}
#layers{top:calc(118px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));padding:10px 12px;width:200px}
.sec{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:2px 0 6px}
.tg{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 0;cursor:pointer;user-select:none}
.tg input{accent-color:var(--water);width:15px;height:15px;margin:0}
.tg .sw{width:10px;height:10px;border-radius:2px;flex:none}
#views{bottom:calc(12px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:5px;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 24px)}
#views button{font:500 12.5px var(--ui);color:var(--ink);background:transparent;border:1px solid transparent;border-radius:6px;padding:7px 12px;cursor:pointer}
#views button:hover{background:rgba(160,210,215,.08)}
#views button[aria-pressed="true"]{background:rgba(63,182,201,.18);border-color:rgba(63,182,201,.45)}
#views button:focus-visible,.tg input:focus-visible,#tod:focus-visible{outline:2px solid var(--water);outline-offset:2px}
#info{top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));width:270px;padding:12px 14px}
#info h2{margin:0 0 2px;font-size:15px;font-weight:600}
#info .sub{font-size:11.5px;color:var(--ink-2);margin-bottom:10px}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:12.5px}
.kv span:nth-child(odd){color:var(--ink-2)}
.kv b{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.pill{display:inline-block;font-family:var(--mono);font-size:10px;padding:2px 6px;border-radius:3px;background:rgba(242,193,78,.14);color:var(--warn);border:1px solid rgba(242,193,78,.35)}
.flow{margin-top:10px;padding-top:10px;border-top:1px solid var(--glass-line);font-size:11.5px;color:var(--ink-2);line-height:1.6}
.flow i{font-style:normal;color:var(--ink)}
#tbar{bottom:calc(70px + env(safe-area-inset-bottom,0px));right:max(12px,env(safe-area-inset-right,0px));width:270px;padding:10px 14px}
#tbar label{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2)}
#tbar label b{font-family:var(--mono);color:var(--ink);font-weight:600}
#tod{width:100%;accent-color:var(--water);margin:6px 0 0}
#legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--ink-2)}
#legend span{display:inline-flex;align-items:center;gap:5px}
#legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
#heatbar{display:none;margin-top:8px}
#heatbar .g{height:8px;border-radius:4px;background:linear-gradient(90deg,#2b4a8a,#2f9fb3,#6fdc8c,#f5e35c)}
#heatbar .t{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-top:3px}
#compass{bottom:calc(70px + env(safe-area-inset-bottom,0px));left:max(12px,env(safe-area-inset-left,0px));width:52px;height:52px;display:grid;place-items:center;border-radius:50%}
#compass svg{width:40px;height:40px}
#credit{position:fixed;bottom:calc(4px + env(safe-area-inset-bottom,0px));right:max(12px,env(safe-area-inset-right,0px));font-size:10px;color:var(--ink-3)}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:12px;color:var(--ink-2);background:var(--bg);transition:opacity .6s}
#loading.done{opacity:0;pointer-events:none}
#toggleUI{display:none}
@media (max-width:720px){
  #head{max-width:calc(100vw - 24px)} #head p{display:none}
  #layers{top:auto;bottom:calc(64px + env(safe-area-inset-bottom,0px));width:auto;right:auto}
  #layers .tgs{display:grid;grid-template-columns:1fr 1fr;column-gap:12px}
  #info{top:auto;bottom:calc(64px + env(safe-area-inset-bottom,0px));right:max(12px,env(safe-area-inset-right,0px));width:min(270px,calc(100vw - 24px))}
  #tbar,#compass{display:none}
  body.panel-info #layers{display:none}
  body:not(.panel-info) #info{display:none}
  #views button{padding:7px 9px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){#loading{transition:none}}
</style>

function render(){const el=$('#info');
  if(!selected){el.innerHTML=`<h2>테스트베드 배치안</h2><div class="sub">Side-stream 순환처리 · 측정 3지점</div>
   <div class="kv"><span>호수 면적(OSM)</span><b>약 2.2 ha</b><span>취수–환수 이격</span><b>${Math.round(Math.hypot(RET[0]-INT[0],RET[1]-INT[1]))} m</b>
   <span>취수 배관</span><b>${Math.round(intakePipe.curve.getLength())} m</b><span>환수 배관</span><b>${Math.round(returnPipe.curve.getLength())} m</b></div>
   <div class="flow">취수 <i>S-01</i> → 펌프 → O₂ 공급 → UFB 발생부 → 와류 TiO₂/UVA 반응부 → 환수 <i>S-03</i><br>부표를 누르면 지점별 수질값을 볼 수 있습니다.</div>
   <div style="margin-top:8px"><span class="pill">배치 위치는 제안안 · 현장 협의 후 확정</span></div>`;return}
  const v=live[selected.id];
  el.innerHTML=`<h2>${selected.code} · ${selected.name}</h2><div class="sub">수심 0.5 m 다항목 수질계 · 2초 갱신</div>
   <div class="kv"><span>DO</span><b>${v.do.toFixed(2)} mg/L</b><span>ORP</span><b>${v.orp} mV</b><span>pH</span><b>${v.ph.toFixed(2)}</b>
   <span>수온</span><b>${v.t.toFixed(1)} °C</b><span>탁도</span><b>${v.ntu.toFixed(1)} NTU</b>
   <span>좌표(공원 기준)</span><b>${selected.p[0]}, ${selected.p[1]} m</b></div>
   <div style="margin-top:10px"><span class="pill">시뮬레이션 데이터 · 실측 연동 전</span></div>
   <div class="flow">표 5 판정: DO 운전 전 대비 30~50% 증가 · 탁도 20% 이상 저감 목표</div>`}
function select(s){selected=s;SENS.forEach(o=>o.lbl.el.classList.toggle('sel',o===s));document.body.classList.add('panel-info');render();
  flyTo([s.p[0]+28,22,s.p[1]+34],[s.p[0],0,s.p[1]]);setPressed(null)}
render();setInterval(drift,2000);

/* ---------- picking ---------- */
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let downAt=null;
renderer.domElement.addEventListener('pointerdown',e=>downAt=[e.clientX,e.clientY]);
renderer.domElement.addEventListener('pointerup',e=>{if(!downAt||Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])>5)return;
  mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mouse,camera);
  const hit=ray.intersectObjects(buoys,true)[0];if(hit){let o=hit.object;while(o&&!o.userData.sensor)o=o.parent;if(o)select(o.userData.sensor)}
  else if(selected){selected=null;SENS.forEach(o=>o.lbl.el.classList.remove('sel'));render()}});

/* ---------- views ---------- */
let fly=null;
function flyTo(pos,tgt,dur){fly={p0:camera.position.clone(),t0:controls.target.clone(),p1:new THREE.Vector3(...pos),t1:new THREE.Vector3(...tgt),s:performance.now(),d:dur||1400}}
const VIEWS={bird:[[260,240,330],[-10,0,0]],top:[[-9,820,10],[-10,0,0]],tb:[[-170,46,-120],[-85,0,-20]],water:[[40,4,150],[-50,1,-10]]};
function setPressed(v){document.querySelectorAll('#views button[data-v]').forEach(b=>{if(b.dataset.v!=='info')b.setAttribute('aria-pressed',String(b.dataset.v===v))})}
document.querySelectorAll('#views button').forEach(b=>b.addEventListener('click',()=>{const v=b.dataset.v;
  if(v==='info'){document.body.classList.toggle('panel-info');return}
  setPressed(v);flyTo(...VIEWS[v])}));

/* ---------- toggles ---------- */
const bind=(id,fn)=>{const el=$(id);el.addEventListener('change',()=>fn(el.checked))};
bind('#lyBuild',v=>buildGroup.visible=v);
bind('#lyTree',v=>treeGroup.visible=v);
bind('#lyLabel',v=>LBL.forEach(l=>{if(l.group==='name')l.hidden=!v}));
bind('#lyTB',v=>{tbGroup.visible=v;LBL.forEach(l=>{if(l.group==='tb')l.hidden=!v})});
bind('#lyHeat',v=>{waterU.uHeat.value=v?1:0;$('#heatbar').style.display=v?'block':'none'});
bind('#lyRot',v=>{controls.autoRotate=v;controls.autoRotateSpeed=0.6});

/* ---------- loop ---------- */
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const tmp=new THREE.Vector3();const clock=new THREE.Clock();
function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function loop(){requestAnimationFrame(loop);const dt=clock.getDelta(),T=clock.elapsedTime;
  if(!reduce)waterU.uTime.value=T;
  if(fly){let t=Math.min(1,(performance.now()-fly.s)/fly.d);const k=reduce?1:ease(t);camera.position.lerpVectors(fly.p0,fly.p1,k);controls.target.lerpVectors(fly.t0,fly.t1,k);if(t>=1||reduce)fly=null}
  controls.update();
  [intakePipe,returnPipe].forEach(pp=>pp.dots.forEach(d=>{d.userData.t=(d.userData.t+dt*(reduce?0:0.06))%1;d.position.copy(pp.curve.getPointAt(d.userData.t))}));
  buoys.forEach((b,i)=>{const s=1+0.25*Math.sin(T*2+i);b.userData.ring.scale.set(s,s,s);b.userData.ring.material.opacity=.65-.35*(s-1)/.25*.5;b.position.y=-0.55+0.06*Math.sin(T*1.4+i)});
  renderer.render(scene,camera);
  const w=innerWidth,h=innerHeight;
  LBL.forEach(l=>{if(l.hidden){l.el.style.display='none';return}tmp.copy(l.v).project(camera);
    const vis=tmp.z<1&&tmp.x>-1.1&&tmp.x<1.1&&tmp.y>-1.1&&tmp.y<1.1;const d=camera.position.distanceTo(l.v);
    if(!vis||(l.group==='name'&&!l.el.classList.contains('big')&&d>900)){l.el.style.display='none';return}
    l.el.style.display='block';l.el.style.left=((tmp.x+1)/2*w)+'px';l.el.style.top=((1-tmp.y)/2*h)+'px'});
  const az=Math.atan2(camera.position.x-controls.target.x,camera.position.z-controls.target.z);
  $('#cneedle').setAttribute('transform',`rotate(${-az*180/Math.PI} 20 20)`);
}
loop();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
setTimeout(()=>$('#loading').classList.add('done'),300);
})();
</script>
